name: Verify slice
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rooms
      - run: npm run test:full
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: verified-client
          path: apps/client/dist
      - uses: actions/upload-artifact@v4
        with:
          name: network-evidence
          path: test-results/*.json
